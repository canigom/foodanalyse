# docker-compose for production VM deployment.
#
# Usage:
#   1. Copy .env.example → .env.production and fill in secrets.
#   2. docker compose --env-file .env.production up -d --build
#   3. Verify: curl http://localhost:3002/api/health
#
# Reverse-proxy this on port 80/443 with nginx + certbot for HTTPS.
# See DEPLOY.md for the full guide.
#
# Ports are non-default so this stack can co-exist with `resumely` on the
# same VM:
#   - app:      host 3002 → container 3000
#   - postgres: host 5433 → container 5432

services:
  db:
    image: postgres:16-alpine
    container_name: kochheute-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kochheute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME}
      POSTGRES_DB: ${POSTGRES_DB:-kochheute}
    volumes:
      - kochheute-db-data:/var/lib/postgresql/data
    ports:
      # Bind to 127.0.0.1 only — the DB shouldn't be reachable from
      # the public internet, just from the host (for psql one-offs).
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    image: kochheute-api:latest
    container_name: kochheute-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      # Inside the compose network the DB is reachable as `db:5432`.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kochheute}:${POSTGRES_PASSWORD:-CHANGEME}@db:5432/${POSTGRES_DB:-kochheute}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3002}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://localhost:3000/api/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  kochheute-db-data:
